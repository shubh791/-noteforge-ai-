<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0c0c18"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Three columns of note lines -->
  <rect x="4"  y="6" width="7" height="2"   rx="1"    fill="url(#g)"/>
  <rect x="4"  y="10" width="7" height="1.5" rx="0.75" fill="#2d3a52"/>
  <rect x="4"  y="13" width="5" height="1.5" rx="0.75" fill="#2d3a52"/>
  <rect x="4"  y="16" width="7" height="1.5" rx="0.75" fill="#2d3a52"/>
  <rect x="4"  y="19" width="4" height="1.5" rx="0.75" fill="#2d3a52"/>

  <rect x="13" y="6" width="6" height="2"   rx="1"    fill="url(#g)"/>
  <rect x="13" y="10" width="6" height="1.5" rx="0.75" fill="#2d3a52"/>
  <rect x="13" y="13" width="4" height="1.5" rx="0.75" fill="#2d3a52"/>
  <rect x="13" y="16" width="6" height="1.5" rx="0.75" fill="#2d3a52"/>
  <rect x="13" y="19" width="5" height="1.5" rx="0.75" fill="#2d3a52"/>

  <rect x="21" y="6" width="7" height="2"   rx="1"    fill="url(#g)"/>
  <rect x="21" y="10" width="7" height="1.5" rx="0.75" fill="#2d3a52"/>
  <rect x="21" y="13" width="5" height="1.5" rx="0.75" fill="#2d3a52"/>
  <rect x="21" y="16" width="7" height="1.5" rx="0.75" fill="#2d3a52"/>
  <rect x="21" y="19" width="3" height="1.5" rx="0.75" fill="#2d3a52"/>

  <!-- Bottom 4-box applications grid -->
  <rect x="4"  y="23" width="5" height="4" rx="1" fill="#1a1f35"/>
  <rect x="11" y="23" width="5" height="4" rx="1" fill="#1a1f35"/>
  <rect x="18" y="23" width="5" height="4" rx="1" fill="#1a1f35"/>
  <rect x="25" y="23" width="3" height="4" rx="1" fill="#1a1f35"/>
</svg>
